<div class="container fade-in">
    <div class="login-card glass-card">
        <div class="logo-wrapper">
            <svg class="login-logo-svg" viewBox="0 0 40 40" width="64" height="64" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="login-logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6366f1" />
                        <stop offset="100%" stop-color="#a855f7" />
                    </linearGradient>
                    <filter id="login-logo-glow">
                        <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <path d="M20 2L36 11V29L20 38L4 29V11L20 2Z" fill="none" stroke="url(#login-logo-grad)" stroke-width="3" filter="url(#login-logo-glow)"/>
                <circle cx="20" cy="20" r="5" fill="url(#login-logo-grad)" />
                <path d="M20 20L36 11" stroke="url(#login-logo-grad)" stroke-width="2" opacity="0.6"/>
                <path d="M20 20L4 29" stroke="url(#login-logo-grad)" stroke-width="2" opacity="0.6"/>
                <path d="M20 20L20 2" stroke="url(#login-logo-grad)" stroke-width="2" opacity="0.6"/>
            </svg>
        </div>
        <h1>Welcome to <span class="gradient-text">Agent</span><span class="hub-text">Hub</span></h1>
        <p>Select your portal to continue</p>

        <div class="role-selector">
            <button (click)="handleLogin('USER')" class="role-btn">
                <span class="icon">👤</span>
                <div class="info">
                    <h3>Customer</h3>
                    <p>Buy and explore agents</p>
                </div>
            </button>

            <button (click)="handleLogin('PUBLISHER')" class="role-btn">
                <span class="icon">🚀</span>
                <div class="info">
                    <h3>Publisher</h3>
                    <p>Publish & earn revenue</p>
                </div>
            </button>

            <button (click)="handleLogin('ADMIN')" class="role-btn">
                <span class="icon">🛡️</span>
                <div class="info">
                    <h3>Administrator</h3>
                    <p>Manage roles & permissions</p>
                </div>
            </button>
        </div>
    </div>
</div>
