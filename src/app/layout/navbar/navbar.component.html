<nav class="navbar glass-card">
    <div class="nav-container">
        <a routerLink="/" class="logo logo-catchy">
            <svg class="logo-svg" viewBox="0 0 40 40" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#6366f1" />
                        <stop offset="100%" stop-color="#a855f7" />
                    </linearGradient>
                    <filter id="logo-glow">
                        <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>
                <path d="M20 2L36 11V29L20 38L4 29V11L20 2Z" fill="none" stroke="url(#logo-grad)" stroke-width="3" filter="url(#logo-glow)"/>
                <circle cx="20" cy="20" r="5" fill="url(#logo-grad)" />
                <path d="M20 20L36 11" stroke="url(#logo-grad)" stroke-width="2" opacity="0.6"/>
                <path d="M20 20L4 29" stroke="url(#logo-grad)" stroke-width="2" opacity="0.6"/>
                <path d="M20 20L20 2" stroke="url(#logo-grad)" stroke-width="2" opacity="0.6"/>
            </svg>
            <div class="logo-text">
                <span class="gradient-text">Agent</span><span class="hub-text">Hub</span>
            </div>
        </a>

        <div class="nav-links">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
            <a routerLink="/agenthub" routerLinkActive="active">AgentHub</a>

            @if (auth.isPublisher()) {
            <a routerLink="/publisher" routerLinkActive="active">Publisher Portal</a>
            }
            @if (auth.isAdmin()) {
            <a routerLink="/admin" routerLinkActive="active">Admin Console</a>
            }
        </div>

        <div class="nav-actions">
            @if (auth.isAuthenticated()) {
            <div class="user-badge">
                <span class="role-pill">{{ auth.currentUser()?.role }}</span>
                <button (click)="auth.logout()" class="btn-logout">Sign Out</button>
            </div>
            } @else {
            <a routerLink="/login" class="btn btn-primary">Sign In</a>
            }
        </div>
    </div>
</nav>
